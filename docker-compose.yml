version: '3.8'

services:
  # Source MongoDB (Simulating Production with ReplicaSet for Oplog PITR)
  mongo-source:
    image: mongo:7.0
    container_name: mongoclone-source-prod
    command: ["--replSet", "rs0", "--bind_ip_all", "--port", "27017"]
    ports:
      - "27017:27017"
    volumes:
      - source-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "try { rs.status().ok } catch(e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'127.0.0.1:27017'}]}).ok }"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Target MongoDB (Simulating Test / Staging)
  mongo-target:
    image: mongo:7.0
    container_name: mongoclone-target-test
    command: ["--bind_ip_all", "--port", "27018"]
    ports:
      - "27018:27018"
    volumes:
      - target-data:/data/db

volumes:
  source-data:
  target-data:
